<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1c1814" />
    <title>Dashboard</title>
    <meta name="apple-mobile-web-app-title" content="Dashboard" />
    <!-- In the home-screen app, the dark page runs up under the status bar (safe-area padding keeps text clear). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="page">
      <!-- The page itself never scrolls; this does, date and all (see keyboard.js). -->
      <div id="scroller" class="scroller">
        <div class="scroll-content">
          <header class="head">
            <h1>
              <button id="flip" class="flip" type="button">
                <span id="flip-label"><time id="today"></time></span>
              </button>
            </h1>
          </header>

          <main class="sheet">
            <p id="empty" class="empty" hidden>A clean page.</p>
            <ul id="items" class="items" aria-label="Things to keep in mind"></ul>
          </main>
        </div>
      </div>

      <footer class="bar">
        <div role="status">
          <div id="undo" class="undo" hidden>
            <span id="undo-label">Archived</span>
            <button id="undo-button" class="word" type="button">Undo</button>
          </div>
        </div>
        <div role="alert">
          <p id="notice" class="notice" hidden></p>
        </div>
        <form id="add" class="add" autocomplete="off">
          <label for="new-item" class="visually-hidden">New item</label>
          <textarea id="new-item" name="text" rows="1" placeholder="Worth remembering…"></textarea>
          <button id="save" class="save" type="submit" aria-label="Save" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 5v6a3 3 0 0 1-3 3H6" />
              <path d="M10 10l-4 4 4 4" />
            </svg>
          </button>
        </form>
        <!-- Signed out, the password field takes the add field's place (docs/UI.md). -->
        <form id="sign-in" class="add sign-in" hidden>
          <!-- Password managers file the password under this name; it isn't shown. -->
          <input class="visually-hidden" type="text" name="username" value="Dashboard" autocomplete="username" tabindex="-1" aria-hidden="true" />
          <label for="password" class="visually-hidden">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" />
          <button id="sign-in-button" class="save" type="submit" aria-label="Sign in">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 5v6a3 3 0 0 1-3 3H6" />
              <path d="M10 10l-4 4 4 4" />
            </svg>
          </button>
        </form>
      </footer>
    </div>
  </body>
</html>
